<!doctype html>
<html lang="en" data-type="classic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thailand Hotel Dice</title>
  <meta name="description" content="Thailand Hotel Dice — Samui Dice, Phangan Dice, Bangkok Dice and Phuket Dice: roll one die to pick a top hotel on Koh Samui, Koh Phangan, in Bangkok or Phuket, with key facts, a monthly price guide, nearby activities and links to Booking.com and Agoda.">
  <link rel="icon" type="image/svg+xml" href="brand/logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Playfair+Display:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top">
      <img class="brand-mark" src="brand/logo-mark.svg" alt="" width="34" height="34">
      <span class="brand-name"><small>Thailand</small>Hotel Dice</span>
    </a>
    <nav class="nav" aria-label="Main">
      <div class="menu">
        <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="destMenu">
          <span class="menu-label" data-i18n="nav.destinations">Destinations</span>
          <span class="menu-current" id="menuCurrent"></span>
          <span class="chev" aria-hidden="true"></span>
        </button>
        <ul class="menu-list" id="destMenu"></ul>
      </div>
      <div class="lang" role="group" data-i18n-aria="lang.label" aria-label="Language">
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="de" lang="de">DE</button>
        <button type="button" data-lang="th" lang="th">ไทย</button>
      </div>
      <button class="nav-contact" type="button" data-request data-i18n="nav.contact">Contact</button>
    </nav>
  </header>

  <section class="hero" id="top">
    <div class="hero-inner">
      <div class="hero-copy">
      <p class="eyebrow" data-i18n="hero.eyebrow">Hotel selection · Thailand</p>
      <h1>Thailand Hotel Dice</h1>
      <p class="hero-lead" data-i18n="hero.lead">A considered way to choose where you stay.</p>
      <p class="intro" data-i18n="hero.intro"></p>
      <ol class="steps">
        <li><span class="step-no">01</span><strong data-i18n="step1.t"></strong><span data-i18n="step1.d"></span></li>
        <li><span class="step-no">02</span><strong data-i18n="step2.t"></strong><span data-i18n="step2.d"></span></li>
        <li><span class="step-no">03</span><strong data-i18n="step3.t"></strong><span data-i18n="step3.d"></span></li>
      </ol>
      <a class="btn btn-gold" href="#play" id="heroCta">Start</a>
      </div>
      <div class="hero-logo" aria-hidden="true">
        <img src="brand/logo-mark-light.svg" alt="" width="240" height="240">
      </div>
    </div>
  </section>

  <main>
    <section class="play" id="play">
      <div class="play-text">
        <p class="kicker" data-i18n="play.kicker">Your dice</p>
        <h2 class="dest-title"><span id="heroTitle">Samui</span> Dice</h2>
        <p class="tagline" id="tagline"></p>
        <button class="btn btn-primary" id="roll" type="button" data-i18n="play.roll">Roll the die</button>
        <p class="hint" id="hint"></p>
      </div>
      <button class="die" id="die" type="button" aria-label="Roll the die" data-i18n-aria="play.roll">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <polygon class="d-outer" points="100,6 181,53 181,147 100,194 19,147 19,53"/>
          <polygon class="d-face"  points="100,40 158,140 42,140"/>
          <polyline class="d-edge" points="100,6 100,40 181,53 158,140 181,147 100,194 100,194 42,140 19,147 42,140 19,53 100,40"/>
          <polyline class="d-edge" points="158,140 100,194 42,140"/>
          <text id="dieValue" x="100" y="116" text-anchor="middle">?</text>
        </svg>
      </button>
    </section>

    <section class="result" id="result" hidden aria-live="polite">
      <figure class="photo" id="rPhotoWrap" hidden>
        <img id="rPhoto" alt="">
      </figure>

      <div class="result-head">
        <div>
          <p class="rank" id="rRank"></p>
          <h2 id="rName"></h2>
          <p class="area" id="rArea"></p>
        </div>
        <button class="btn btn-gold" type="button" data-request="hotel" data-i18n="r.request">Request this place</button>
      </div>

      <dl class="facts">
        <div><dt data-i18n="f.rooms"></dt><dd id="rRooms"></dd></div>
        <div><dt data-i18n="f.category"></dt><dd id="rCategory"></dd></div>
        <div><dt data-i18n="f.restaurant"></dt><dd id="rRestaurant"></dd></div>
        <div><dt data-i18n="f.avg"></dt><dd id="rAvg"></dd></div>
      </dl>

      <div class="block tonight">
        <div class="tonight-head">
          <h3 data-i18n="tonight.title"></h3>
          <p id="rTonight"></p>
          <p class="est" data-i18n="tonight.est"></p>
        </div>
        <div class="deals">
          <a class="deal booking" id="rBooking" target="_blank" rel="noopener">
            <span class="deal-media"><img class="deal-photo" alt="" hidden></span>
            <span class="deal-logo" aria-label="Booking.com">Booking<span>.com</span></span>
            <span class="deal-cta" data-i18n="deal.cta"></span>
          </a>
          <a class="deal agoda" id="rAgoda" target="_blank" rel="noopener">
            <span class="deal-media"><img class="deal-photo" alt="" hidden></span>
            <span class="deal-logo" aria-label="Agoda">agoda<i></i><i></i><i></i><i></i><i></i></span>
            <span class="deal-cta" data-i18n="deal.cta"></span>
          </a>
        </div>
      </div>

      <div class="block">
        <div class="block-head">
          <h3 data-i18n="season.title"></h3>
          <p data-i18n="season.sub"></p>
        </div>
        <div class="months" id="rMonths"></div>
      </div>

      <div class="block">
        <div class="block-head"><h3 data-i18n="loc.title"></h3></div>
        <iframe class="map" id="rMap" title="Satellite map of the hotel" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>

      <div class="block nearby" id="nearby" hidden>
        <div class="block-head">
          <div>
            <h3 data-i18n="nb.title"></h3>
            <p data-i18n="nb.sub"></p>
          </div>
          <div class="nb-nav">
            <button type="button" class="nb-btn" id="nbPrev" aria-label="Previous activity" data-i18n-aria="nb.prev">←</button>
            <button type="button" class="nb-btn" id="nbNext" aria-label="Next activity" data-i18n-aria="nb.next">→</button>
          </div>
        </div>
        <div class="nb-viewport" id="nbViewport" tabindex="0" aria-roledescription="carousel" aria-label="Nearby activities">
          <div class="nb-track" id="nbTrack"></div>
        </div>
        <div class="nb-dots" id="nbDots" aria-hidden="true"></div>
      </div>

      <div class="result-cta">
        <p data-i18n="cta.text"></p>
        <button class="btn btn-gold" type="button" data-request="hotel" data-i18n="r.request">Request this place</button>
      </div>

      <p class="note" data-i18n="note"></p>
    </section>

    <section class="list">
      <div class="block-head">
        <div>
          <h2 id="listTitle">All hotels</h2>
          <p data-i18n="list.hint"></p>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th data-i18n="th.no"></th><th data-i18n="th.hotel"></th><th data-i18n="th.area"></th><th data-i18n="th.rooms"></th><th data-i18n="th.category"></th><th data-i18n="th.restaurant"></th><th data-i18n="th.avg"></th><th data-i18n="th.rates"></th></tr></thead>
          <tbody id="hotelTable"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div>
        <img class="footer-logo" src="brand/logo-light.svg" alt="Thailand Hotel Dice" width="220" height="44">
        <p data-i18n="footer.note"></p>
      </div>
      <button class="btn btn-outline-light" type="button" data-request data-i18n="footer.contact">Contact us</button>
    </div>
  </footer>

  <dialog class="modal" id="requestDialog" aria-labelledby="reqTitle">
    <form class="req-form" id="requestForm" novalidate>
      <button class="modal-close" type="button" id="reqClose" aria-label="Close" data-i18n-aria="req.close">×</button>
      <p class="eyebrow dark" id="reqEyebrow">Request this place</p>
      <h2 id="reqTitle">Hotel name</h2>
      <p class="req-lead" data-i18n="req.lead"></p>

      <div class="req-body" id="reqBody">
        <label class="field">
          <span><span data-i18n="req.name"></span> <em data-i18n="req.required"></em></span>
          <input type="text" name="name" autocomplete="name" required>
        </label>
        <label class="field">
          <span><span data-i18n="req.email"></span> <em data-i18n="req.required"></em></span>
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label class="field">
          <span><span data-i18n="req.confirm"></span> <em data-i18n="req.required"></em></span>
          <input type="email" name="email_confirm" autocomplete="off" required>
        </label>

        <fieldset class="field ages">
          <legend><span data-i18n="req.age"></span> <em data-i18n="req.optional"></em></legend>
          <label><input type="radio" name="age_group" value="18–22"><span>18–22</span></label>
          <label><input type="radio" name="age_group" value="23–27"><span>23–27</span></label>
          <label><input type="radio" name="age_group" value="28–45"><span>28–45</span></label>
          <label><input type="radio" name="age_group" value="46+"><span>46+</span></label>
        </fieldset>

        <label class="consent">
          <input type="checkbox" name="consent" required>
          <span data-i18n="req.consent"></span>
        </label>

        <input type="text" name="company" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <input type="hidden" name="hotel">
        <input type="hidden" name="destination">

        <p class="form-error" id="reqError" role="alert" hidden></p>
        <button class="btn btn-primary btn-block" type="submit" id="reqSubmit" data-i18n="req.send"></button>
        <p class="demo-note" id="reqDemo" hidden data-i18n="req.demo"></p>
      </div>

      <div class="req-done" id="reqDone" hidden>
        <p class="done-mark" aria-hidden="true">✓</p>
        <p data-i18n-html="req.done"></p>
        <button class="btn btn-outline" type="button" id="reqDoneClose" data-i18n="req.close"></button>
      </div>
    </form>
  </dialog>

  <div class="type-switch" role="group" aria-label="Draft: compare typefaces">
    <span data-i18n="draft.type"></span>
    <button type="button" data-type="classic" aria-pressed="true">Classic</button>
    <button type="button" data-type="editorial" aria-pressed="false">Editorial</button>
    <button type="button" data-type="swiss" aria-pressed="false">Swiss</button>
    <button type="button" class="ts-close" id="typeClose" aria-label="Hide typeface panel">×</button>
  </div>

  <script src="data/samui.js?v=10"></script>
  <script src="data/phangan.js?v=10"></script>
  <script src="data/bangkok.js?v=10"></script>
  <script src="data/phuket.js?v=10"></script>
  <script src="data/activities-samui.js?v=10"></script>
  <script src="data/activities-phangan.js?v=10"></script>
  <script src="data/activities-bangkok.js?v=10"></script>
  <script src="data/activities-phuket.js?v=10"></script>
  <script src="data/activities-i18n.js?v=10"></script>
  <script src="i18n.js?v=10"></script>
  <script src="script.js?v=10"></script>
</body>
</html>
