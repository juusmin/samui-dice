<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Thailand Hotel Dice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC15A"/><stop offset=".55" stop-color="#F4755E"/><stop offset="1" stop-color="#C9508F"/>
    </linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#g)"/>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#gl)"/>
  <!-- two-tier Thai sala roof with upturned chofa tips -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 29 L32 14.5 L52 29" stroke-width="3.4"/>
    <path d="M12 29 q-2.8 -.4 -3.4 -4.4" stroke-width="3.4"/>
    <path d="M52 29 q2.8 -.4 3.4 -4.4" stroke-width="3.4"/>
    <path d="M20 31.5 L32 23 L44 31.5" stroke-width="2.4" opacity=".7"/>
    <path d="M32 14.5 V8.5" stroke-width="3"/>
  </g>
  <!-- keyhole: the room key, and the die's centre pip -->
  <circle cx="32" cy="38.5" r="4.4" fill="#fff"/>
  <path d="M29.8 41.2 L28.4 50.5 h7.2 L34.2 41.2 z" fill="#fff"/>
  <!-- die pips -->
  <circle cx="15.5" cy="48.5" r="2.7" fill="#fff" opacity=".95"/>
  <circle cx="48.5" cy="48.5" r="2.7" fill="#fff" opacity=".95"/>
</svg>
